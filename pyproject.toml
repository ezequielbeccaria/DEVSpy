[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "devspy"
version = "0.1.0"
description = "Python port of Devs-Suite-Facade — headless DEVS simulation with time-limit support"
readme = "README.md"
license = "Apache-2.0"
authors = ["Ezequiel Beccaria <ezequielbeccaria@gmail.com>"]
keywords = ["devs", "simulation", "discrete-event", "modeling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Simulation",
]
packages = [{ include = "devspy", from = "src" }]

[tool.poetry.dependencies]
python = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
ruff = "^0.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py39"
