name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip poetry
          poetry install
      - name: Lint
        run: poetry run ruff check src tests benchmarks
      - name: Tests (includes the PDEVS reference-simulator oracle)
        run: poetry run pytest -q
      - name: Oracle sensitivity (mutation check)
        if: matrix.python-version == '3.12'
        run: |
          out=$(poetry run python benchmarks/mutation_check.py)
          echo "$out"
          ! echo "$out" | grep -q MISSED
