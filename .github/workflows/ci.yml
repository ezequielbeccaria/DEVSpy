name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.11"]
    env:
      PYPY: ${{ startsWith(matrix.python-version, 'pypy') }}
    steps:
      - uses: actions/checkout@v4
      - name: CPython 3.12 alongside PyPy (to compare traces)
        if: env.PYPY == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-python@v5  # set up last: this is the default `python`
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPython, with Poetry)
        if: env.PYPY == 'false'
        run: |
          python -m pip install --upgrade pip poetry
          poetry install
      # DEVSpy has no dependencies; skip Poetry (whose own deps include C
      # extensions) on PyPy and install just the package and pytest.
      - name: Install (PyPy)
        if: env.PYPY == 'true'
        run: python -m pip install --upgrade pip pytest -e .
      - name: Lint
        if: env.PYPY == 'false'
        run: poetry run ruff check src tests benchmarks
      - name: Tests (includes the PDEVS reference-simulator oracle)
        run: ${{ env.PYPY == 'true' && 'python -m pytest -q' || 'poetry run pytest -q' }}
      - name: Same λ/δ trace as CPython
        if: env.PYPY == 'true'
        run: |
          pypy=$(python benchmarks/trace_diff.py --model-level | tail -1)
          cpython=$(PYTHONPATH=src python3.12 benchmarks/trace_diff.py --model-level | tail -1)
          echo "PyPy:    $pypy"; echo "CPython: $cpython"
          test "$pypy" = "$cpython"
      - name: Oracle sensitivity (mutation check)
        if: matrix.python-version == '3.12'
        run: |
          out=$(poetry run python benchmarks/mutation_check.py)
          echo "$out"
          ! echo "$out" | grep -q MISSED
